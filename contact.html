  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://tesliukphoto.netlify.app/contact.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tesliuk Tetiana">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:locale:alternate" content="en_US">

  <meta property="og:description" content="Відкрита для зйомок і колаборацій.">
  <meta property="og:image" content="https://tesliukphoto.netlify.app/images/hero/drift-bmw.jpg">
  <meta property="og:image:width" content="2000">
  <meta property="og:image:height" content="1124">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="assets/css/style.css">
  <title>Contact — Tesliuk Tetiana</title>
</head>
<body data-title="titles.contact">
  <div class="grain"></div>

  <header class="hdr">
    <a class="hdr__logo" href="index.html" data-name>Tesliuk Tetiana</a>

    <nav class="hdr__nav">
      <a class="ul" href="index.html" data-i18n="nav.work">Work</a>
      <a class="ul" href="about.html" data-i18n="nav.about">About</a>
      <a class="ul" href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>

    <div class="hdr__right">
      <a class="ig" href="#" data-ig target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>
      <div class="lang" data-lang></div>
      <a class="ul" href="contact.html" data-i18n="nav.talk">Let’s talk</a>
    </div>

    <div class="hdr__m">
      <a class="ig" href="#" data-ig target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>
      <div class="lang" data-lang></div>
      <button class="burger" type="button" aria-label="Menu"><i></i><i></i></button>
    </div>
  </header>

  <div class="menu">
    <nav class="menu__list">
      <a href="index.html" data-i18n="nav.work">Work</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="menu__foot">
      <span class="mono">© <span data-year></span> — <span data-name></span></span>
      <a class="ig" href="#" data-ig target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </div>

  <section class="sec" style="padding-top:calc(var(--pad) + 110px)">
    <div class="sec__head">
      <h1 class="sec__title" data-i18n="sections.contact">Contact</h1>
      <span class="mono" data-i18n="contactPage.sub">Open for shoots and collaborations</span>
    </div>

    <a class="contact__mail reveal" href="#" data-email data-cursor="write"></a>

    <div class="contact__grid">
      <div class="reveal">
        <span class="mono" data-i18n="contactPage.phone">Phone</span>
        <a class="ul" href="#" data-phone></a>
      </div>
      <div class="reveal" data-d="1">
        <span class="mono" data-i18n="contactPage.socials">Socials</span>
        <a class="ul" href="#" data-ig target="_blank" rel="noopener">Instagram</a>
        <a class="ul" href="#" data-tg target="_blank" rel="noopener">Telegram</a>
      </div>
      <div class="reveal" data-d="2">
        <span class="mono" data-i18n="contactPage.base">Based</span>
        <span style="display:block;margin-top:6px" data-i18n="contactPage.baseValue"></span>
      </div>
    </div>

    <form class="form reveal" data-form>
      <label><span class="mono" data-i18n="contactPage.formName">Your name</span><input name="name" required></label>
      <label><span class="mono" data-i18n="contactPage.formContact">Email or telegram</span><input name="contact" required></label>
      <label><span class="mono" data-i18n="contactPage.formMsg">About the shoot</span><textarea name="msg" rows="3" required></textarea></label>
      <button class="btn" type="submit" data-i18n="contactPage.send" data-cursor="send">Send</button>
    </form>
  </section>

  <footer class="ftr">
    <h2 class="ftr__big reveal">
      <span data-i18n="footer.big1">Let’s</span><br><span data-i18n="footer.big2">work</span>
    </h2>
    <div class="ftr__row">
      <a class="lead ul" href="#" data-email data-cursor="write"></a>
      <div class="ftr__links mono">
        <a class="ig" href="#" data-ig target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>
        <a class="ul" href="#" data-ig target="_blank" rel="noopener">Instagram</a>
        <a class="ul" href="#" data-tg target="_blank" rel="noopener">Telegram</a>
        <a class="ul" href="#" data-phone></a>
      </div>
    </div>
    <div class="ftr__row mono" style="margin-top:46px">
      <span>© <span data-year></span> <span data-name></span></span>
      <span data-i18n="hero.tagline">Racing · Automotive · Commerce</span>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
